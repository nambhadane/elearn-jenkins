# ================================================
# MySQL PersistentVolumeClaim
# Ensures database data survives pod restarts
# ================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: default
  labels:
    app: elearnhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

