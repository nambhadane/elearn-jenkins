# ================================================
# MySQL Deployment
# Runs a single MySQL 8.0 pod with persistent storage
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: default
  labels:
    app: elearnhub
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elearnhub
      tier: database
  template:
    metadata:
      labels:
        app: elearnhub
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            # Allow root to connect from any host (required for pod-to-pod access)
            - name: MYSQL_ROOT_HOST
              value: "%"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -pNamrata@1805
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - -pNamrata@1805
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
# ================================================
# MySQL ClusterIP Service
# Internal-only — backend connects via this DNS name
# DNS: mysql-service.default.svc.cluster.local
# ================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: default
  labels:
    app: elearnhub
    tier: database
spec:
  selector:
    app: elearnhub
    tier: database
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP

