[supervisord]
nodaemon=true

[program:mysql]
command=/bin/sh -c "
if [ ! -d /var/lib/mysql/mysql ]; then
  echo 'Initializing MySQL...';
  mysqld --initialize --user=mysql;
fi;

echo 'Starting MySQL...';
mysqld --user=mysql &
MYSQL_PID=$!;

echo 'Waiting for MySQL...';
until mysqladmin ping -h 127.0.0.1 --silent; do
  sleep 2;
done;

echo 'Setting root password...';
mysql -u root -e \"ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'Namrata@1805'; FLUSH PRIVILEGES;\"

wait $MYSQL_PID
"
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr



[program:backend]
command=sh -c "sleep 20 && java -jar /app/app.jar"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2

[program:frontend]
directory=/app/frontend/eduflow-hub
command=npm run dev -- --host
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
