[supervisord]
nodaemon=true

[program:mysql]
command=/bin/sh -c "([ ! -d /var/lib/mysql/mysql ] && mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql); mysqld --user=mysql --datadir=/var/lib/mysql --init-file=/app/init.sql"
user=mysql
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2


[program:backend]
command=sh -c "sleep 20 && java -jar /app/app.jar"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2

[program:frontend]
directory=/app/frontend/eduflow-hub
command=npm run dev -- --host
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
