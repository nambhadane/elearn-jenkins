[supervisord]
nodaemon=true

[program:mysql]
command=/bin/sh -c "\
    if [ ! -d /var/lib/mysql/mysql ]; then \
        mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql && \
        mysqld --skip-networking --user=mysql --datadir=/var/lib/mysql & \
        pid=\$!; \
        sleep 10; \
        mysql -uroot --protocol=socket -e \"ALTER USER 'root'@'localhost' IDENTIFIED BY 'Namrata@1805'; FLUSH PRIVILEGES;\"; \
        kill \$pid; wait \$pid; \
    fi; \
    mysqld --user=mysql --datadir=/var/lib/mysql"
user=mysql
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2


[program:backend]
command=sh -c "sleep 20 && java -jar /app/app.jar"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2

[program:frontend]
directory=/app/frontend/eduflow-hub
command=npm run dev -- --host
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
